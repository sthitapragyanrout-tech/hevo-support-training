# Production stack. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# See DEPLOY.md for first-time setup, updates and backups.
#
# Differences from docker-compose.yml (development): gunicorn instead of runserver,
# production settings, no source-code mounts, Postgres and Redis not published to the
# host, and nginx in front serving the built frontend.

x-app: &app
  build: ./backend
  image: hevo-training-backend
  restart: unless-stopped
  env_file:
    - .env.prod
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    MEDIA_ROOT: /var/media
    MEDIA_ACCEL_REDIRECT: /protected-media/
  volumes:
    - media:/var/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  web:
    <<: *app
    # Static files (Django Admin's CSS) are copied to a volume nginx serves.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application -c gunicorn.conf.py"
    environment:
      <<: *app-env
      STATIC_ROOT: /var/static
    volumes:
      - media:/var/media
      - static:/var/static
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Video conversion (ffmpeg), one at a time unless raised.
  worker-media:
    <<: *app
    command: >
      celery -A config worker -Q media -n media@%h
      -c ${MEDIA_WORKER_CONCURRENCY:-1} -l info
    mem_limit: 2g

  # Practice tickets (calls the language model).
  worker-sim:
    <<: *app
    command: >
      celery -A config worker -Q sim -n sim@%h
      -c ${SIMBOT_WORKER_CONCURRENCY:-4} --max-tasks-per-child 200 --prefetch-multiplier 1 -l info
    mem_limit: 1g

  # The one scheduler: reminders, recovery sweeps, nightly practice top-up.
  beat:
    <<: *app
    command: celery -A config beat -s /var/media/celerybeat-schedule -l info

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      # http.conf (default) or https.conf — see DEPLOY.md.
      - ./deploy/nginx/${NGINX_SITE:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/common.inc:/etc/nginx/conf.d/common.inc:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - media:/var/media:ro
      - static:/var/static:ro
    depends_on:
      - web

volumes:
  pgdata:
  media:
  static:
