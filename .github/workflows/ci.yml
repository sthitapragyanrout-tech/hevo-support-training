name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hevo_training_test
          POSTGRES_USER: hevo
          POSTGRES_PASSWORD: hevo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hevo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hevo:hevo@localhost:5432/hevo_training_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install ffmpeg (video tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        working-directory: .
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy .
      - name: Test (pytest)
        run: uv run pytest --cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build
