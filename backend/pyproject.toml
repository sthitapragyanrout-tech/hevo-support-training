[project]
name = "hevo-training-backend"
version = "0.1.0"
description = "Hevo Support Training Platform — Django backend (M1 Foundations)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.1",
    "django-environ>=0.11",
    "argon2-cffi>=23.1",
    "django-axes>=6.5",
    "django-admin-sortable2>=2.2",
    "django-json-widget>=2.0",
    "jsonschema>=4.22",
    "redis>=5.0",
    "celery>=5.4",
    "openpyxl>=3.1.5",
    "openai>=3.37.0",
    "gunicorn>=22",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs>=3.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Data-literal-heavy placeholder seed tree — wrapping every dict would hurt
# readability more than it helps; the schema-shape is what matters here.
"apps/catalog/management/commands/seed_placeholder_course.py" = ["E501"]
# Prompts and topic text are prose; wrapping them would hurt readability.
"simbot_engine/*.py" = ["E501"]
"tests/engine/*.py" = ["E501"]
"tests/test_sim_*.py" = ["E501"]
"tests/test_zendesk_*.py" = ["E501"]
"tests/load/*.py" = ["E501"]
"tests/sim_helpers.py" = ["E501"]
"scripts/*.py" = ["E501"]
"apps/bot_sim/seed_data.py" = ["E501"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "worker: starts a real Celery worker process (needs Postgres and ffmpeg)",
    "load: the 13-session load test; real processes, takes minutes (run with -m load)",
]
