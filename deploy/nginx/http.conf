# Plain HTTP on port 80. Use this when:
#  - something in front of this server already handles HTTPS (a load balancer or another
#    nginx), which passes X-Forwarded-Proto: https — or
#  - for a first trial by IP address, with USE_HTTPS=false in .env.prod.
# Otherwise use https.conf (NGINX_SITE=https).

# Trust the scheme a proxy in front reports; else what this connection used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/conf.d/common.inc;
}
