# HTTPS on port 443, with port 80 redirecting to it. Put the certificate in
# deploy/nginx/certs/ as fullchain.pem and privkey.pem (see DEPLOY.md).

map $http_x_forwarded_proto $forwarded_proto {
    default https;
}

server {
    listen 80 default_server;
    server_name _;
    location = /healthz { proxy_pass http://web:8000; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/conf.d/common.inc;
}
